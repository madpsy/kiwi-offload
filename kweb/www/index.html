<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>kweb</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M1 12 Q4 2 8 9 T15 4%27 stroke=%27%235ec4ff%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E">
<style>
:root{--bg:#0d1117;--panel:#131a22;--card:#17202b;--fg:#d6dde6;--dim:#8b96a3;--line:#2b3440;--accent:#5ec4ff;--ok:#7ee787;--warn:#f0b35e;--bad:#ff7b72}
*{box-sizing:border-box}
:root{color-scheme:dark}   /* native controls and scrollbars in the dark theme */
*{scrollbar-width:thin;scrollbar-color:#3a4552 transparent}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a4552;border-radius:6px;border:2px solid transparent;background-clip:padding-box} ::-webkit-scrollbar-thumb:hover{background:#4b5868;background-clip:padding-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
header b{font-size:15px}
.pill{padding:1px 8px;border-radius:9px;background:#1b2430;color:var(--dim);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
/* the ADC overload LED: green, red (with a glow) while the ADC clips */
.adcled{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;
        background:radial-gradient(circle at 38% 35%,#d9ffd9 0,#3fd45a 45%,#1d7a31 100%);box-shadow:0 0 5px 1px rgb(63 212 90/.55)}
.adcled.ov{background:radial-gradient(circle at 38% 35%,#ffe0dd 0,#ff4b3e 45%,#a3160d 100%);box-shadow:0 0 7px 2px rgb(255 75 62/.8)}
main{padding:8px 16px 16px}
.view{position:relative;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.view h2{margin:0;padding:4px 10px;font-size:12px;font-weight:600;color:var(--dim);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
canvas{display:block;width:100%}
.spec{height:110px} .spec,.wf{cursor:crosshair} .axis{height:20px} .wf{height:150px;image-rendering:pixelated}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0}
label{color:var(--dim)} input,select,button{background:#1b2430;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 7px;font:inherit}
button{cursor:pointer} button.primary{border-color:var(--accent);color:var(--accent)} button:disabled{opacity:.5;cursor:default}
input[type=number]{width:6.5em} input[type=range]{vertical-align:middle;width:90px}
.vfos{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.vfo{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.vfo.sel{border-color:var(--vc)}
.vfo.parked{opacity:.55;border-style:dashed}
.vfo .top{display:flex;align-items:flex-start;gap:8px}
.vfo .top .tl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.vfo .top .tr{display:flex;align-items:center;gap:6px;flex:none;min-height:26px}
.vfo .tag{font-weight:700;color:var(--vc)}
.vfo .top .age{color:var(--dim);font:12px ui-monospace,monospace;white-space:nowrap;cursor:help}
.vfo .f{font:600 17px/1 ui-monospace,monospace;width:8.5em}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.vfo .pb{display:inline-flex;align-items:center;gap:4px;white-space:nowrap} .vfo .lo,.vfo .hi{width:5em}
.note{color:var(--warn)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:10px}
.panel h3{margin:0 0 4px;font-size:12px;color:var(--dim)}
.meter{position:relative;flex:1;min-width:120px;height:10px;background:#0b1016;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.meter .lvl{position:absolute;inset:0;background:linear-gradient(90deg,#2f81f7,#3fb9d8,#7ee787,#e3d75a,#f0883e,#ff5a4f);clip-path:inset(0 100% 0 0)}   /* the scale fixed across the meter; the level reveals it (JS: clip-path) */
.meter .thrm{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ff7b72}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3b4450} .dot.open{background:var(--ok)}
.read{font:12px ui-monospace,monospace;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;min-width:0}
.scale{font-weight:400;white-space:nowrap} .scale select,.scale input{padding:0 3px;font-size:11px} .scale input{width:4.2em}
.scale input:disabled{opacity:.6}
@media (max-width:640px){.wf{height:110px}.vfos{grid-template-columns:1fr}}
/* the user's waterfall off: no spectrum, axis or waterfall (kweb sends no rows); the VFO cards in the page's flow */
body.nowf #wsec>h2,body.nowf .spec,body.nowf .axis,body.nowf .wf,body.nowf #nsec{display:none}
body.nowf.zoomwf{height:auto;overflow:visible} body.nowf.zoomwf #wsec{flex:none}
body.nowf.zoomwf #wsec>.vfos{position:static;display:grid;pointer-events:auto}
/* [kweb] zoom_waterfall: one main waterfall, taller by the narrow view's height */
/* the waterfall fills the window down to the controls; the VFO panels float over its lower edge */
body.zoomwf{height:100vh;display:flex;flex-direction:column;overflow:hidden}
body.zoomwf main{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:8px}
body.zoomwf main>.bar{flex:none;margin:8px 0 0}
body.zoomwf #wsec{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:0}
body.zoomwf #wwf{flex:1;min-height:120px;height:auto}
body.zoomwf #wsec>.vfos{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;display:flex;gap:8px;overflow-x:auto;align-items:flex-end;pointer-events:none}
body.zoomwf #wsec>.vfos .vfo{pointer-events:auto;flex:0 0 370px;width:370px;min-width:0;overflow:hidden;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(3px)}
.vfo .more{display:none} body.zoomwf #wsec>.vfos .vfo .more{display:inline-block}
body.zoomwf #wsec>.vfos .vfo:not(.open)>:not(.top):not(.mrow):not(.crow){display:none}   /* compact over the waterfall: the top line + the meter; ▾ opens the rest */
body.zoomwf #wsec>.vfos .vfo:not(.open) .cbw,body.zoomwf #wsec>.vfos .vfo:not(.open) .csq{display:inline-flex;align-items:center;gap:5px;flex:none;white-space:nowrap}
body.zoomwf #wsec>.vfos .vfo:not(.open) .csqt{width:auto}
.vfo .crow{display:none} body.zoomwf #wsec>.vfos .vfo:not(.open)>.crow{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
body.zoomwf #wsec>.vfos .vfo:not(.open) .csql{flex:1;min-width:50px;width:auto}
body.zoomwf #wsec>.vfos .vfo:not(.open) .f{width:6.6em}
body.zoomwf #wsec>.vfos .vfo:not(.open) .tl>span:not(.tag){display:none}   /* (the "kHz" label: the frequency is plainly kHz) */
body.zoomwf #wsec>.vfos .vfo:not(.open) .tl{flex-wrap:nowrap;gap:6px} body.zoomwf #wsec>.vfos .vfo:not(.open) .tl .mode{max-width:6.5em;min-width:0}
.vfo .bwv{font:12px ui-monospace,monospace;min-width:5.5em;text-align:right}
body.zoomwf #wsec>.vfos .vfo:not(.open) .mode{width:auto;max-width:7.5em}
@media (max-width:640px){body.zoomwf{height:auto;overflow:visible} body.zoomwf #wwf{flex:none;height:260px}
  body.zoomwf #wsec>.vfos{position:static;display:grid;padding:8px;pointer-events:auto}}
/* the decodes window: floating, dragged by its title bar, resized from its corner (saved in the browser) */
#digipanel{position:fixed;right:16px;bottom:16px;width:560px;max-width:calc(100vw - 32px);height:340px;min-width:300px;min-height:120px;z-index:50;margin:0;
  display:flex;flex-direction:column;resize:both;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.55)}
#digipanel[hidden]{display:none} #digipanel.min{height:auto!important;min-height:0;resize:none} #digipanel.min .digiscroll{display:none}
#digipanel h3{display:flex;justify-content:space-between;gap:8px;cursor:move;user-select:none;margin:0 0 4px} #digipanel .dim{color:var(--dim);font-weight:400}
#digipanel h3 button,#digipanel h3 label,#digipanel h3 .chip{cursor:pointer}
#digibusy{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:400;font-size:12px} #digibusy[hidden]{display:none}
.spin{width:10px;height:10px;border:2px solid #5ec4ff40;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
#digisearch{width:9em;font:12px system-ui,sans-serif;padding:1px 6px} #digitab mark{background:#5ec4ff40;color:inherit;border-radius:2px;padding:0 1px}
.digiscroll{flex:1;min-height:0;overflow:auto} #digitab{border-collapse:collapse;width:auto;font:12px/1.35 ui-monospace,monospace}
#digitab td.num,#digitab th.num{min-width:3.5ch}
#digitab th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--dim);font-weight:600}
#digitab td,#digitab th{padding:1px 8px 1px 0;white-space:nowrap} #digitab .num{text-align:right} #digitab tr.new td{color:var(--fg)}
#digitab td{color:var(--fg)} #digitab tr.sep td{color:var(--dim);padding-top:6px;border-bottom:1px solid var(--line)}
#digitab tr.cq td.msg{color:#7ee787} #digitab tr.cq td.msg b{font-weight:700} #digitab .low{color:var(--dim)}
/* the period bar under the title: 2 px, the accent colour, the time left beside it */
.digicyc{display:flex;align-items:center;gap:8px;margin:0 0 4px} .digicyc[hidden]{display:none}
.digicyc .trk{flex:1;min-width:0;height:2px;background:var(--line);border-radius:1px;overflow:hidden}
.digicyc .fill{height:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
.digicyc .left{font:11px ui-monospace,monospace;color:var(--dim);white-space:nowrap;min-width:16ch;text-align:right}
.digictl{display:flex;gap:10px;align-items:center;font-weight:400} .chip{border:1px solid var(--line);border-radius:9px;padding:0 7px;cursor:pointer;color:var(--dim)}
.chip.on{color:var(--fg);border-color:var(--accent)} .vfo .dstat{color:var(--dim);font-size:12px}
/* "On air": who listens where, the PC's streams, the board (a dropdown under the users pill) */
#users.oa{cursor:pointer} #users.oa:hover,#users.oa.open{color:var(--fg);outline:1px solid var(--line)}
#users.flash{animation:oaflash 1s ease-in-out 3}
@keyframes oaflash{50%{color:var(--accent);outline:1px solid var(--accent)}}
#onair{position:fixed;z-index:30;width:min(560px,calc(100vw - 32px));max-height:62vh;overflow:auto;background:var(--card);
  border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px #000a;padding:8px 10px}
#onair h3{margin:8px 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
#onair .oah{display:flex;justify-content:space-between;align-items:center;gap:8px} #onair .oah b{font-size:13px}
#onair .oar{display:flex;align-items:center;gap:8px;padding:3px 0;border-top:1px solid var(--line);flex-wrap:wrap}
#onair .oar:first-of-type{border-top:0} #onair .oaw{color:var(--dim);flex:1 1 auto;min-width:0}
#onair .oav{display:flex;align-items:center;gap:6px;width:100%;padding-left:14px}
#onair .oav .f{font-variant-numeric:tabular-nums;min-width:7.5em} #onair .oav .m{color:var(--dim);min-width:3.2em}
#onair .oav .sp{flex:1} #onair button{padding:1px 7px;font-size:12px} #onair .dim{color:var(--dim)}
#onair .you{color:var(--accent)}
.vfo.along{outline:1px dashed var(--accent)} .alongbar{display:none;gap:8px;align-items:center;color:var(--accent);font-size:12px}
.vfo.along .alongbar{display:flex!important}   /* (also in the compact card over the waterfall, which hides other rows) */
</style></head>
<body>
<header>
  <b>kweb</b>
  <span id="conn" class="pill">connecting…</span>
  <span id="ddc" class="pill">DDC: –</span>
  <span id="role" class="pill">listener</span>
  <span id="users" class="pill" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false" title="who is on air">users –</span>
  <span id="cpu" class="pill">CPU –</span>
  <span id="adcp" class="pill" hidden><span class="adcled" id="adcled"></span><span id="adct">ADC</span></span>
  <span id="gpsp" class="pill">GPS: no GPS data</span>
  <button id="audio" class="primary">▶ start audio</button>
  <label>volume <input id="vol" type="range" min="0" max="100" value="70"></label>
  <span id="outdev" hidden><label>output <select id="sink"><option value="">default</option></select></label> <button id="pickdev">choose…</button></span>
</header>
<div id="onair" hidden role="dialog" aria-label="On air"></div>
<main>
  <section class="view" id="wsec">
    <h2><span><span id="wtitle">Full band 0–33 MHz</span> — click: tune there · wheel: zoom · drag: pan</span><span><span class="scale" data-p="w">scale <select class="smode"><option value="auto">auto</option><option value="manual">manual</option></select> <input class="slo" type="number" step="1"> – <input class="shi" type="number" step="1"> dB · avg <select class="savg" title="spectrum line averaging (the waterfall is not averaged further)"><option value="off">off</option><option value="low">low</option><option value="med">medium</option><option value="high">high</option></select></span> <span id="wspan"></span></span></h2>
    <canvas id="wspec" class="spec"></canvas><canvas id="waxis" class="axis"></canvas><canvas id="wwf" class="wf"></canvas>
  </section>
  <section class="view" id="nsec">
    <h2><span id="ntitle">DDC window</span><span>click: tune the selected VFO · wheel: zoom · drag: pan · double-click: reset <span class="scale" data-p="n">scale <select class="smode"><option value="auto">auto</option><option value="manual">manual</option></select> <input class="slo" type="number" step="1"> – <input class="shi" type="number" step="1"> dB · avg <select class="savg" title="spectrum line averaging (the waterfall is not averaged further)"><option value="off">off</option><option value="low">low</option><option value="med">medium</option><option value="high">high</option></select></span></span></h2>
    <canvas id="nspec" class="spec"></canvas><canvas id="naxis" class="axis"></canvas><canvas id="nwf" class="wf"></canvas>
  </section>
  <div class="bar">
    <label>go to kHz <input id="goto" type="number" step="0.1" placeholder="e.g. 14074" style="width:8em"></label> <button id="gotogo">go</button>
    <label>listen to <select id="source"></select></label>
    <label title="off: no spectrum or waterfall (saves the Kiwi's CPU and your data; tune with go to or the VFO's frequency)"><input type="checkbox" id="wfon" checked> waterfall</label>
    <label title="off: waterfall only, no receiver for you (+ VFO or this turns it back on)"><input type="checkbox" id="audon" checked> audio</label>
    <button id="addvfo">+ VFO</button> <button id="digibtn" hidden title="the digital decodes window">decodes</button>
    <span id="owner_ctl" hidden>
      <label>DDC width <select id="width"></select></label>
      <label>centre kHz <input id="dfc" type="number" step="1"></label>
      <button id="dgo">move window</button>
    </span>
    <span id="claim"><label>owner password <input id="pw" type="password" style="width:8em"></label> <button id="claimgo">claim</button></span>
    <span id="note" class="note"></span>
  </div>
  <div id="vfos" class="vfos"></div>
  <div class="panel" id="digipanel" hidden><h3 id="digihead"><span>Decodes <span id="digistat" class="dim"></span> <span id="digibusy" hidden><span class="spin"></span></span></span>
    <span class="digictl"><span id="digichips"></span><input id="digisearch" type="search" placeholder="search" title="show only decodes whose text contains this (as you type; Esc clears)" autocomplete="off" spellcheck="false"><label><input type="checkbox" id="digicq"> CQ only</label> <button id="digiclear">clear</button>
      <button id="digimin" title="minimise">–</button><button id="digiclose" title="close (the 'decodes' button opens it again)">✕</button></span></h3>
    <div class="digicyc" id="digicyc" hidden title="the current UTC period: it is decoded at its end"><div class="trk"><div class="fill" id="digicycf"></div></div><span class="left" id="digicyct"></span></div>
    <div class="digiscroll"><table id="digitab"><thead><tr><th class="num">dB</th><th class="num">DT</th><th class="num">Freq</th><th>Message</th></tr></thead><tbody></tbody></table></div></div>
</main>
<template id="vfo_t">
  <div class="vfo">
    <div class="top"><span class="tl"><span class="tag"></span><input class="f" type="number" step="0.01" title="kHz"><span>kHz</span>
      <select class="mode"><option value="usb">USB</option><option value="lsb">LSB</option><option value="cw">CW</option><option value="am">AM</option><option value="amn">AM narrow</option>
        <option value="sam">SAM</option><option value="sau">SAM-U</option><option value="sal">SAM-L</option><option value="sas" title="synchronous AM with the sidebands apart: lower sideband in the left ear, upper in the right (for interference on one side, or ISB); not AM-stereo broadcasts">SAM L/R</option><option value="nfm">NFM</option><option value="iq" title="the channel's I in the left ear, Q in the right">IQ (I left, Q right)</option>
        <optgroup label="digital"><option value="ft8">FT8</option><option value="ft4">FT4</option><option value="ft2">FT2</option><option value="wspr">WSPR</option></optgroup></select>
      </span><span class="tr"><span class="age"></span><button class="more" title="more controls">▾</button><button class="del" title="remove this VFO">✕</button></span></div>
    <div class="row"><span class="pb"><label>passband <input class="lo" type="number" step="50"> … <input class="hi" type="number" step="50"></label><button class="bwn" title="narrower">−</button><button class="bww" title="wider">+</button></span>
      <label>codec <select class="codec"><option value="opus">Opus</option><option value="opus_hq">Opus HQ</option><option value="adpcm">ADPCM</option><option value="pcm12">PCM 12 kS/s</option></select></label></div>
    <div class="row"><label>AGC <select class="agc"><option>slow</option><option>fast</option><option>manual</option></select></label>
      <label class="gainl">gain <input class="gain" type="number" step="1" style="width:4.5em"> dB</label>
      <label class="thrl">threshold <input class="thr" type="number" step="1" style="width:4.5em"> dB</label>
      <label><input class="hang" type="checkbox"> hang</label></div>
    <div class="row"><label><input class="nb" type="checkbox"> NB</label><label><input class="anf" type="checkbox"> notch</label><label><input class="nr" type="checkbox"> NR</label>
      <span class="nfmctl"><label><input class="deemph" type="checkbox"> de-emph</label></span>
      <span class="cwctl"><label title="the tone a signal on the dial is heard at">pitch <input class="pitch" type="number" min="200" max="1500" step="10" style="width:4.5em"> Hz</label></span></div>
    <div class="row"><span class="dot" title="squelch open/closed"></span>
      <label>squelch <select class="sqt"><option value="off">off</option><option value="snr">SNR</option><option value="level">level</option><option value="noise">noise (FM)</option></select></label>
      <label class="sqautol"><input class="sqauto" type="checkbox"> auto</label>
      <label class="pxxl" title="noise floor = this percentile of the spectrum around the VFO">P<select class="pxx"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></label>
      <input class="sql" type="range" step="0.5" style="width:110px"></div>
    <div class="row crow"><span class="cbw" title="passband width"><span class="bwv"></span><button class="cbwn" title="narrower">−</button><button class="cbww" title="wider">+</button></span>
      <span class="csq" title="squelch: type and threshold"><span class="dot"></span><select class="csqt"><option value="off">SQ off</option><option value="snr">SQ SNR</option><option value="level">SQ level</option><option value="noise">SQ noise</option></select></span>
      <input class="csql" type="range" step="0.5" title="squelch threshold"></div>
    <div class="row mrow"><div class="meter"><div class="lvl"></div><div class="thrm"></div></div><span class="read"></span></div>
    <div class="row dstat" hidden></div>
    <div class="row alongbar"><span class="alongt"></span><button class="alongstop" title="your own VFO again, when there is room">stop listening along</button></div>
    <div class="row"><label>vol <input class="vvol" type="range" min="0" max="150" value="100"></label><label>pan <input class="pan" type="range" min="-100" max="100" value="0"></label>
      <label><input class="mute" type="checkbox"> mute</label><label title="off: received but not played (e.g. for a decoder)"><input class="play" type="checkbox" checked> play</label>
      <span class="vnote note"></span></div>
  </div>
</template>
<script>
'use strict';
const $ = id => document.getElementById(id);
const COLORS = ['#ffb86b', '#7ee787', '#d2a8ff', '#ff7b72', '#79c0ff', '#f2cc60', '#56d4dd', '#ffa198'];
let ws, st = null, sel = 0, opusOk = false;
const W = { f0: 0, f1: 33.3333e6, held: null, spec: null }, N = { f0: 0, f1: 0, held: null, spec: null, userZoom: false };
// [kweb] zoom_waterfall (status.zoom_cfg): one main waterfall zoomed down to min_span; Z: what feeds it (kweb's 'zoom')
const ZC = { on: false, min: 50e3 };
let Z = null, gotoWant = null;
const vfos = new Map();          // id -> { el, state, audio: { gain, pan, dec, playAt } }
const stats = { wide: 0, narrow: 0, wideBytes: 0, narrowBytes: 0, audio: 0, audioBytes: 0, status: 0, opus: 0, adpcm: 0, pcm: 0, played: 0 };
let actx = null, master = null, sinkEl = null;

// ---- connection

  const now = Date.now() / 1e3;
  for (const [, x] of vfos) {
    const el = x.el.querySelector('.dstat');

      + (!c ? 'waiting for audio' : c.partial ? `joined mid-period: first decode in ${left} s` : `next decode in ${left} s`)

setInterval(digiStatus, 1000);
// the decodes window's period bar: how far through its current UTC period the first decoding VFO is (the bar's end

function digiBar() {

    if (!x || $('digipanel').hidden) { digiRaf = 0; $('digicyc').hidden = true; return; }
    const ms = Date.now(), off = x.dat && ms - x.dat < 2000 ? x.doff : gpsOff !== null ? gpsOff : 0;

const DW = (() => { try { return JSON.parse(localStorage.getItem('kweb.decodes') || 'null') || {}; } catch (e) { return {}; } })();

}
function digiShow(on) {

$('digiclose').addEventListener('click', () => digiShow(false));
$('digimin').addEventListener('click', () => { DW.min = !DW.min; dwSave(); dwApply(); });
$('digihead').addEventListener('mousedown', ev => {

  const mv = e => { DW.x = Math.max(0, Math.min(innerWidth - 120, e.clientX - dx)); DW.y = Math.max(0, Math.min(innerHeight - 40, e.clientY - dy));
                    el.style.left = DW.x + 'px'; el.style.top = DW.y + 'px'; el.style.right = el.style.bottom = 'auto'; };

function onAudio(dv, buf) {
  {   // digital decoding works without audio playing: its 12 kS/s PCM goes to the period capture first
    const x = vfos.get(dv.getUint8(1));
    if (x && x.dig && dv.getUint8(2) === 3 && !(dv.getUint8(3) & 2)) {
      const sec = dv.getUint32(12, true), nsec = dv.getUint32(16, true), seq = dv.getUint32(4, true);
      digiFeed(x, seq, sec ? sec + nsec * 1e-9 : Date.now() / 1e3 - 0.3, new Int16Array(buf.slice(24)), !!(dv.getUint8(3) & 1));
    }
  }
  const id = dv.getUint8(1), codec = dv.getUint8(2), flags = dv.getUint8(3), ns = dv.getUint32(8, true), chans = flags & 2 ? 2 : 1, muted = flags & 1;
  const x = vfos.get(id); if (!x) return;
  const sec = dv.getUint32(12, true), t0 = sec ? sec + dv.getUint32(16, true) * 1e-9 : 0;   // UTC of the frame's first sample
  if (t0) { const g = ageOf(x); g.as += Date.now() / 1e3 - (t0 + 0.02); g.an++; g.src = flags & 4 ? 2 : flags & 8 ? 1 : 0; }   // (its last sample: +20 ms)
  if (!actx) return;
  const body = new Uint8Array(buf, 24);
  if (codec === 2 || codec === 4) {                // Opus (CELT) via WebCodecs
    stats.opus++;
    const a = x.audio;
    if (!a.dec || a.decCh !== chans) {
      try { a.dec && a.dec.close(); } catch (e) {}
      a.decCh = chans; a.ts = 0; a.stamps = new Map();
      a.dec = new AudioDecoder({ output: d => { const pl = []; for (let c = 0; c < d.numberOfChannels; c++) { const f = new Float32Array(d.numberOfFrames); d.copyTo(f, { planeIndex: c, format: 'f32-planar' }); pl.push(f); }
                                                const t = a.stamps.get(d.timestamp); a.stamps.delete(d.timestamp);
                                                play(id, d.numberOfChannels, d.sampleRate, pl, t); d.close(); },
                                 error: e => { note('Opus decoder: ' + e.message); a.dec = null; } });
      a.dec.configure({ codec: 'opus', sampleRate: 24000, numberOfChannels: chans });
    }
    if (a.dec && a.dec.state === 'configured') {
      if (t0) { a.stamps.set(a.ts, t0); if (a.stamps.size > 64) a.stamps.delete(a.stamps.keys().next().value); }
      a.dec.decode(new EncodedAudioChunk({ type: 'key', timestamp: a.ts, data: body })); a.ts += 20000;
    }

    stats.adpcm++;

    for (let c = 0; c < chans; c++) { const f = new Float32Array(ns); off = adpcm(body, off, ns, f); if (muted) f.fill(0); pl.push(f); }

    stats.pcm++;
    const s16 = new Int16Array(buf.slice(24)), pl = [];
    for (let c = 0; c < chans; c++) { const f = new Float32Array(ns); for (let i = 0; i < ns; i++) f[i] = s16[i * chans + c] / 32768; pl.push(f); }
    play(id, chans, 12000, pl, t0);
  }
}
$('audio').addEventListener('click', async () => {
  if (!actx) {

    // through an <audio> element, so the output device can be chosen (HTMLMediaElement.setSinkId: Chrome and Firefox)
