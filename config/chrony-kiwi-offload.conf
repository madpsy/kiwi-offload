# chrony on the Beagle: GPS time from kbridge, and NTP for the local network.
# Install: sudo cp config/chrony-kiwi-offload.conf /etc/chrony/conf.d/kiwi-offload.conf && sudo systemctl restart chrony
# (Debian's chrony.conf reads /etc/chrony/conf.d; its internet pool stays as the backup and cross-check.)

# kbridge posts each precise GPS time ([kbridge] gps_chrony = on; one satellite at gps_location, or a fix) to NTP
# shared memory unit 0, as (GPS UTC, system clock) at its clock snapshot. ~1 ms precision (the snapshot is timed
# through the PRU mailbox); no PPS.
refclock SHM 0 refid GPS poll 3 precision 1e-3 delay 0.002

# serve time to the local network: the RFC 1918 private ranges only. Other networks (e.g. a public subnet the Beagle
# sits in): add 'allow <net>' lines in a site file of your own, e.g. /etc/chrony/conf.d/local.conf (install.sh leaves
# other files there alone).
allow 192.168.0.0/16
allow 10.0.0.0/8
allow 172.16.0.0/12
