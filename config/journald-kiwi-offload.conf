# /etc/systemd/journald.conf.d/kiwi-offload.conf (tools/install.sh; --keep-logs skips it): the journal in RAM only.
# The Beagle's root filesystem is its eMMC: logs written there wear it for nothing (none are needed after a reboot).
# In /run/log/journal (tmpfs), capped and rotated by journald itself: a year of uptime stays within these limits.
[Journal]
Storage=volatile
RuntimeMaxUse=16M
RuntimeMaxFileSize=2M
RuntimeKeepFree=8M
# rsyslog is disabled by install.sh: nothing to forward to (it copied every line to /var/log on the eMMC)
ForwardToSyslog=no
